# The documentation site with the live demo (docs/README.md).
#
#   merge into main                         # build the WebAssembly module and the site, publish it
#   pull request into main                  # build only, so a broken site fails before the merge
#   gh workflow run docs                    # by hand: build only
#   gh workflow run docs -f deploy=true     # by hand: build, then publish to Cloudflare Pages
#
# Changes to only the notes (PLAN.md, the READMEs) don't run it: none of them is part of the site.
#
# Free hosted runner. Deploying needs the repository secrets CLOUDFLARE_API_TOKEN (permission
# "Cloudflare Pages: Edit") and CLOUDFLARE_ACCOUNT_ID, and a Pages project made for direct upload, named by
# the repository variable CLOUDFLARE_PAGES_PROJECT (default "just-keypoints").
name: docs

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "tools/*.md"
      - "docs/README.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "tools/*.md"
      - "docs/README.md"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish to Cloudflare Pages"
        type: boolean
        default: false

# One run per branch or pull request; a newer push replaces a run still going, so main always publishes
# its latest commit.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EMSCRIPTEN_VERSION: "7.0.0"

jobs:
  docs:
    name: build (and deploy) the site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r docs/requirements.txt ninja
      - name: Install Emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSCRIPTEN_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSCRIPTEN_VERSION"
      - name: Fetch emdawnwebgpu
        run: tools/fetch_webgpu.sh browser
      # The browser build of the library: the module, its wrapper and the weights, in build/wasm/web.
      - name: Build the WebAssembly module
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build/wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DJKP_EMBED_WEIGHTS=OFF \
            -DJKP_BUILD_CLI=OFF -DJKP_BUILD_TESTS=OFF -DJKP_WEBGPU=ON
          cmake --build build/wasm
      - name: Build the site (warnings are errors)
        run: sphinx-build -W --keep-going -b html docs docs/_build/html
      - uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' || inputs.deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4.162.0 pages deploy docs/_build/html
          --project-name "${{ vars.CLOUDFLARE_PAGES_PROJECT || 'just-keypoints' }}" --branch main
