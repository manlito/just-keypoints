# The site's own theme, after just-ba's: Sphinx's "basic" theme (page structure, search, indices) with this
# project's layout, style and script on top. No outside theme.
[theme]
inherit = "basic"
stylesheets = ["basic.css", "jkp.css"]
sidebars = []
pygments_style = { default = "default" }

[options]
accent = "#0b7a68"
accent_dark = "#4fd1b5"
